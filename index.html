<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Nidoo</title>
  <!-- Police ronde et ludique (Google Fonts). Sans internet, une police ronde du système prend le relais. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Barre du haut -->
  <header class="barre">
    <h1 class="titre" aria-label="Nidoo">
      <span>N</span><span>i</span><span>d</span><span>o</span><span>o</span>
    </h1>
    <div class="actions">
      <button id="bouton-ajouter" class="bouton" hidden>+ Ajouter</button>
      <button id="bouton-modifier" class="bouton">Modifier</button>
    </div>
  </header>

  <!-- La grille : les widgets sont ajoutés ici par js/app.js -->
  <main id="grille" class="grille"></main>

  <!-- Fenêtre "Ajouter un widget" -->
  <dialog id="galerie" class="galerie">
    <h2>Ajouter un widget</h2>
    <div id="liste-widgets" class="liste-widgets"></div>
    <button id="fermer-galerie" class="bouton">Annuler</button>
  </dialog>

  <!-- 1. Les outils de base -->
  <script src="js/stockage.js"></script>
  <script src="js/widgets.js"></script>

  <!-- 2. Les widgets (un fichier par widget, à ajouter ici) -->
  <script src="widgets/horloge.js"></script>
  <script src="widgets/note.js"></script>

  <!-- 3. L'application (toujours en dernier) -->
  <script src="js/app.js"></script>
</body>
</html>
